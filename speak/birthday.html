<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Ankita!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to right top, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .card {
      text-align: center;
      padding-top: 10vh;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3em;
      animation: popIn 2s ease forwards;
      opacity: 0;
    }

    h2 {
      margin-top: 10px;
      font-size: 1.5em;
      font-weight: normal;
      animation: fadeIn 3s ease-in forwards;
      opacity: 0;
    }

    .nickname {
      font-style: italic;
      font-size: 1.2em;
      margin-top: 5px;
      color: #ffeecc;
    }

    .date {
      margin-top: 20px;
      font-size: 1.1em;
      color: #fff4e6;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 60px;
      height: 80px;
      border-radius: 50% 50% 50% 50%;
      background-color: red;
      animation: floatBalloon 6s infinite ease-in-out;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 40px;
      background: white;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes floatBalloon {
      0% { bottom: -100px; opacity: 0; }
      50% { opacity: 1; }
      100% { bottom: 100vh; opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      animation: fall 4s infinite linear;
      opacity: 0.8;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Happy Birthday Ankita! 🎂</h1>
    <h2>Wishing you a day filled with love, laughter, and surprises!</h2>
    <div class="nickname">aka "Chhota Don"</div>
    <div class="date">Celebrating on 16 July 2025</div>
  </div>

  <!-- Balloons -->
  <div class="balloon" style="left: 10%; background: #ff4d4d; animation-delay: 0s;"></div>
  <div class="balloon" style="left: 30%; background: #ffcc00; animation-delay: 2s;"></div>
  <div class="balloon" style="left: 50%; background: #66ff66; animation-delay: 4s;"></div>
  <div class="balloon" style="left: 70%; background: #6699ff; animation-delay: 6s;"></div>
  <div class="balloon" style="left: 90%; background: #cc66ff; animation-delay: 1s;"></div>

  <!-- Confetti -->
  <script>
    for (let i = 0; i < 150; i++) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = Math.random() * -20 + 'vh';
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
      confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
      confetti.style.opacity = Math.random();
      document.body.appendChild(confetti);
    }
  </script>
</body>
</html>
